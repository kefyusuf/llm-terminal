name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main
      - release/**
  pull_request:
    branches:
      - master
      - main

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.14"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install lock tooling
        run: |
          python -m pip install --upgrade pip "pip-tools==7.5.3"

      - name: Bootstrap environment
        run: python scripts/dev.py bootstrap

      - name: Run verify lane
        shell: bash
        run: |
          set -o pipefail
          python scripts/dev.py verify 2>&1 | tee verify.log

      - name: Upload verify logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verify-logs-${{ matrix.os }}-py${{ matrix.python-version }}
          path: verify.log
          if-no-files-found: ignore

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lock tooling
        run: |
          python -m pip install --upgrade pip "pip-tools==7.5.3"

      - name: Bootstrap environment
        run: python scripts/dev.py bootstrap

      - name: Run coverage gate
        shell: bash
        run: |
          set -o pipefail
          python scripts/dev.py coverage 2>&1 | tee coverage.log

      - name: Upload coverage logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-logs-ubuntu-py3.12
          path: coverage.log
          if-no-files-found: ignore

  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.14"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install lock tooling
        run: |
          python -m pip install --upgrade pip "pip-tools==7.5.3"

      - name: Bootstrap environment
        run: python scripts/dev.py bootstrap

      - name: Run smoke lane
        shell: bash
        run: |
          set -o pipefail
          python scripts/dev.py smoke 2>&1 | tee smoke.log

      - name: Upload smoke logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-logs-${{ matrix.os }}-py${{ matrix.python-version }}
          path: smoke.log
          if-no-files-found: ignore

  macos:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lock tooling
        run: |
          python -m pip install --upgrade pip "pip-tools==7.5.3"

      - name: Bootstrap environment
        run: python scripts/dev.py bootstrap

      - name: Run verify lane
        shell: bash
        run: |
          set -o pipefail
          python scripts/dev.py verify 2>&1 | tee verify-macos.log

      - name: Diagnose API smoke subprocess
        continue-on-error: true
        timeout-minutes: 1
        shell: bash
        env:
          AIMODEL_SMOKE: "1"
        run: |
          .venv/bin/python -c "import faulthandler, api_server; faulthandler.dump_traceback_later(10); raise SystemExit(api_server.main([]))"

      - name: Run smoke lane
        shell: bash
        run: |
          set -o pipefail
          python scripts/dev.py smoke 2>&1 | tee smoke-macos.log

      - name: Upload macOS logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: macos-logs-py3.12
          path: |
            verify-macos.log
            smoke-macos.log
          if-no-files-found: ignore
