name: CI

on:
  workflow_dispatch:
    inputs:
      live_hf_recovery:
        description: "Acquire the pinned 19 MB public HF sample for bounded recovery acceptance (no inference)"
        type: boolean
        required: false
        default: false
  push:
    branches:
      - master
      - main
      - release/**
  pull_request:
    branches:
      - master
      - main

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.14"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install lock tooling
        run: |
          python -m pip install --upgrade pip "pip-tools==7.5.3"

      - name: Bootstrap environment
        run: python scripts/dev.py bootstrap

      - name: Run verify lane
        shell: bash
        run: |
          set -o pipefail
          python scripts/dev.py verify 2>&1 | tee verify.log

      - name: Upload verify logs
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: verify-logs-${{ matrix.os }}-py${{ matrix.python-version }}
          path: verify.log
          if-no-files-found: ignore

      - name: Run opt-in pinned HF recovery acceptance
        if: github.event_name == 'workflow_dispatch' && inputs.live_hf_recovery && matrix.python-version == '3.12'
        timeout-minutes: 6
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            recovery_python=".venv/Scripts/python.exe"
          else
            recovery_python=".venv/bin/python"
          fi
          "$recovery_python" scripts/verify_hf_recovery.py \
            ggml-org/models-moved tinyllamas/stories15M-q4_0.gguf \
            --revision 499bc8821c6b12b4e53c5bffcb21ec206f212d81 \
            --work-dir .venv/hf-recovery-live \
            --output .venv/hf-recovery-live-report.json \
            --max-bytes 67108864 --timeout 120

      - name: Preserve opt-in recovery report
        if: always() && github.event_name == 'workflow_dispatch' && inputs.live_hf_recovery && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v6
        with:
          name: hf-recovery-${{ matrix.os }}-${{ github.sha }}
          path: .venv/hf-recovery-live-report.json
          if-no-files-found: warn
          retention-days: 30

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install lock tooling
        run: |
          python -m pip install --upgrade pip "pip-tools==7.5.3"

      - name: Bootstrap environment
        run: python scripts/dev.py bootstrap

      - name: Run coverage gate
        shell: bash
        run: |
          set -o pipefail
          python scripts/dev.py coverage 2>&1 | tee coverage.log

      - name: Upload coverage logs
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: coverage-logs-ubuntu-py3.12
          path: coverage.log
          if-no-files-found: ignore

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Bootstrap environment
        run: python scripts/dev.py bootstrap

      - name: Run staged mypy gate
        shell: bash
        run: |
          set -o pipefail
          .venv/bin/python -m mypy \
            core downloads results terminal_ui \
            app/search_results_state.py \
            search/search_cache.py search/search_orchestration.py \
            2>&1 | tee typecheck.log

      - name: Upload typecheck logs
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: typecheck-logs-ubuntu-py3.12
          path: typecheck.log
          if-no-files-found: ignore

  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.14"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install lock tooling
        run: |
          python -m pip install --upgrade pip "pip-tools==7.5.3"

      - name: Bootstrap environment
        run: python scripts/dev.py bootstrap

      - name: Run smoke lane
        shell: bash
        run: |
          set -o pipefail
          python scripts/dev.py smoke 2>&1 | tee smoke.log

      - name: Upload smoke logs
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: smoke-logs-${{ matrix.os }}-py${{ matrix.python-version }}
          path: smoke.log
          if-no-files-found: ignore

  macos:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install lock tooling
        run: |
          python -m pip install --upgrade pip "pip-tools==7.5.3"

      - name: Bootstrap environment
        run: python scripts/dev.py bootstrap

      - name: Run verify lane
        shell: bash
        run: |
          set -o pipefail
          python scripts/dev.py verify 2>&1 | tee verify-macos.log

      - name: Run smoke lane
        shell: bash
        run: |
          set -o pipefail
          python scripts/dev.py smoke 2>&1 | tee smoke-macos.log

      - name: Upload macOS logs
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: macos-logs-py3.12
          path: |
            verify-macos.log
            smoke-macos.log
          if-no-files-found: ignore
