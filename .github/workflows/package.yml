name: Package

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "pyproject.toml"
      - "cli.py"
      - "main.py"
      - "api_server.py"
      - "config.py"
      - "tui_app.py"
      - "app/**"
      - "core/**"
      - "downloads/**"
      - "providers/**"
      - "results/**"
      - "search/**"
      - "terminal_ui/**"
      - "scripts/verify_installed_package.py"
      - "tests/test_installed_package.py"
      - ".github/workflows/package.yml"

jobs:
  installation:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        kind: [wheel]
        include:
          - os: ubuntu-latest
            python-version: "3.12"
            kind: sdist
          - os: windows-latest
            python-version: "3.12"
            kind: sdist
          - os: macos-latest
            python-version: "3.12"
            kind: sdist
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install build tooling
        run: python -m pip install --upgrade pip build

      - name: Build distributions
        run: python -m build --outdir dist

      - name: Verify fresh installation outside checkout
        run: >-
          python scripts/verify_installed_package.py --dist-dir dist
          --kind ${{ matrix.kind }} --report package-report.json

      - name: Upload installation evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: package-${{ matrix.os }}-py${{ matrix.python-version }}-${{ matrix.kind }}
          path: package-report.json
          if-no-files-found: warn
