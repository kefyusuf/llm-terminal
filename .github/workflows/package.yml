name: Package

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "pyproject.toml"
      - "cli.py"
      - "main.py"
      - "api_server.py"
      - "config.py"
      - "tui_app.py"
      - "app/**"
      - "core/**"
      - "downloads/**"
      - "providers/**"
      - "results/**"
      - "search/**"
      - "terminal_ui/**"
      - "scripts/verify_installed_package.py"
      - "scripts/package_candidate.py"
      - "tests/test_installed_package.py"
      - "tests/test_package_candidate.py"
      - ".github/workflows/package.yml"

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build and metadata tooling
        run: python -m pip install --upgrade build twine

      - name: Build candidate once
        run: python -m build --outdir dist

      - name: Validate distribution metadata
        run: python -m twine check dist/*

      - name: Record source and distribution identity
        run: >-
          python scripts/package_candidate.py --dist-dir dist
          --source-sha ${{ github.sha }} --manifest dist/candidate-manifest.json

      - name: Preserve candidate bytes and manifest
        uses: actions/upload-artifact@v6
        with:
          name: package-candidate-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

  installation:
    needs: candidate
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        kind: [wheel]
        include:
          - os: ubuntu-latest
            python-version: "3.12"
            kind: sdist
          - os: windows-latest
            python-version: "3.12"
            kind: sdist
          - os: macos-latest
            python-version: "3.12"
            kind: sdist
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install build tooling
        run: python -m pip install --upgrade pip build

      - name: Retrieve the same candidate distributions
        uses: actions/download-artifact@v6
        with:
          name: package-candidate-${{ github.sha }}
          path: dist

      - name: Verify source and distribution identity before installation
        run: >-
          python scripts/package_candidate.py --dist-dir dist
          --source-sha ${{ github.sha }} --manifest dist/candidate-manifest.json --verify

      - name: Verify fresh installation outside checkout
        run: >-
          python scripts/verify_installed_package.py --dist-dir dist
          --kind ${{ matrix.kind }} --report package-report.json

      - name: Upload installation evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: package-${{ matrix.os }}-py${{ matrix.python-version }}-${{ matrix.kind }}
          path: package-report.json
          if-no-files-found: warn
