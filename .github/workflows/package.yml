name: Package

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "pyproject.toml"
      - "cli.py"
      - "main.py"
      - "api_server.py"
      - "config.py"
      - "tui_app.py"
      - "app/**"
      - "core/**"
      - "downloads/**"
      - "providers/**"
      - "results/**"
      - "search/**"
      - "terminal_ui/**"
      - ".github/workflows/package.yml"

jobs:
  wheel:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade pip build

      - name: Build distributions
        run: python -m build

      - name: Install built wheel
        run: >-
          python -c "import glob, subprocess, sys; wheels = glob.glob('dist/*.whl');
          assert len(wheels) == 1, wheels;
          subprocess.check_call([sys.executable, '-m', 'pip', 'install', wheels[0]])"

      - name: Verify installed imports
        run: python -c "import main, cli, api_server; print('installed-import-ok')"

      - name: Verify installed CLI entry point
        run: ai-model-explorer-cli version
