name: Live Checks

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

jobs:
  live-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install lock tooling
        run: |
          python -m pip install --upgrade pip "pip-tools==7.5.3"

      - name: Bootstrap environment
        run: python scripts/dev.py bootstrap

      - name: Run live lane
        shell: bash
        run: |
          set -o pipefail
          python scripts/dev.py live 2>&1 | tee live-tests.log

      - name: Upload live logs
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: live-logs-ubuntu-latest-py3.14
          path: live-tests.log
          if-no-files-found: ignore
